name: Release

# 发布流程：打 tag 即发布。
# - push 一个 v* tag：校验版本号 → 语法/JSON 检查 → 打包 → 建 GitHub Release 并附 tarball。
# - 手动触发：先按 package.json 的版本校验输入，打注解 tag 并推到远端，再走同一套发布步骤
#   （GITHUB_TOKEN 推的 tag 不会触发 workflow，所以两步写在同一个 job 里）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（不带 v，必须与 package.json 的 version 一致），例如 0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # generate-notes 要读到上一个 tag 的提交历史。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 决定 tag 与版本
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::无法从 $TAG 解析出版本号，tag 必须形如 v1.2.3"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "发布 $TAG（版本 $VERSION）"

      - name: 校验 package.json 版本与 tag 一致
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.version !== process.env.VERSION) {
              console.error(`::error::package.json 版本 ${pkg.version} 与 tag ${process.env.TAG} 不一致，先改 package.json 再发版`);
              process.exit(1);
            }
            if (!pkg.dsh || !pkg.dsh.bundle) {
              console.error("::error::package.json 缺 dsh.bundle，不能作为 DSH 插件发布");
              process.exit(1);
            }
            console.log(`${pkg.name}@${pkg.version}`);
          '

      - name: 语法与 JSON 检查
        run: |
          for file in index.js client.js lib/*.js; do
            node --check "$file"
          done
          for file in package.json locale/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done
          echo "检查通过"

      - name: 手动打 tag 并推送
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::远端已有 $TAG，换一个版本号；要重发这个版本请删除远端 tag 后再手动触发"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: 打包
        id: pack
        run: |
          TGZ=$(npm pack --silent | tail -n 1)
          test -f "$TGZ"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          echo "打好的包：$TGZ"

      - name: 建 Release 并附 tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TGZ: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖其 tarball"
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          echo "安装地址（固定版本）：github:guoxdxdxd/WorkSelf#$TAG"
